[package]
name = "yachiyo-desktop"
version = "0.1.0"
description = "八千代桌宠"
edition = "2021"
[lib]
name = "yachiyo_desktop_lib"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[features]
# 仅性能验收时启用，日常开发和发行不编译测量流程。
# （serde_json 现在是常规依赖：设置与后续的养成数据都要 JSON 落盘。）
perf-audit = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "=2.11.3", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-fs = "=2.5.2"
