[package]
name = "yachiyo-desktop"
version = "0.1.0"
description = "八千代桌宠"
edition = "2021"
[lib]
name = "yachiyo_desktop_lib"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "=2.11.3", features = ["protocol-asset"] }
tauri-plugin-fs = "=2.5.2"
